
name: DUOTALK Android Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Установить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установить Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Создать Android-проект
        run: flutter create --platforms=android --project-name duotalk --org com.duotalk .

      - name: Добавить разрешение микрофона
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()

          permission = '<uses-permission android:name="android.permission.RECORD_AUDIO"/>'

          if permission not in content:
              content = content.replace(
                  '<application',
                  permission + '\n    <application',
                  1
              )
              manifest.write_text(content)

          print("Разрешение микрофона добавлено")
          PY

      - name: Установить зависимости
        run: flutter pub get

      - name: Собрать APK
        run: flutter build apk --release --no-shrink

      - name: Сохранить APK
        uses: actions/upload-artifact@v4
        with:
          name: DUOTALK-APK
          path: build/app/outputs/flutter-apk/app-release.apk
