
name: DUOTALK Android Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Установить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установить Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Создать Android-проект
        run: flutter create --platforms=android --project-name duotalk --org com.duotalk .

      - name: Отключить минификацию R8
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts")
          ]

          for file in files:
              if file.exists():
                  text = file.read_text()
                  text = text.replace("isMinifyEnabled = true", "isMinifyEnabled = false")
                  text = text.replace("minifyEnabled true", "minifyEnabled false")
                  text = text.replace("isShrinkResources = true", "isShrinkResources = false")
                  text = text.replace("shrinkResources true", "shrinkResources false")
                  file.write_text(text)
                  print(f"Настройки обновлены: {file}")

          PY

      - name: Установить зависимости
        run: flutter pub get

      - name: Собрать APK
        run: flutter build apk --release

      - name: Сохранить APK
        uses: actions/upload-artifact@v4
        with:
          name: DUOTALK-APK
          path: build/app/outputs/flutter-apk/app-release.apk
